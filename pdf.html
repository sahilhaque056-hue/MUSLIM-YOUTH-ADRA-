<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUSLIM YOUTH ADRA - Evidence Report</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #06140e, #0b3d2e);
    color: white;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 24px;
    letter-spacing: 1px;
}

.header p {
    color: #b9ccc4;
    font-size: 13px;
    margin-top: 7px;
}

.card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 18px;
    padding: 22px;
    backdrop-filter: blur(10px);
}

label {
    display: block;
    margin: 15px 0 7px;
    font-size: 13px;
    color: #dce8e3;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    border: none;
    outline: none;
    border-radius: 9px;
    font-size: 14px;
    background: white;
    color: #111;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

/* SCREENSHOT UPLOAD */

.screenshot-box {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px dashed rgba(255,255,255,0.35);
    border-radius: 10px;
    padding: 14px;
}

.screenshot-box input[type="file"] {
    background: white;
    color: #111;
    padding: 10px;
}

.preview-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 12px;
}

.preview-item {
    position: relative;
    background: rgba(0,0,0,0.25);
    border-radius: 9px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.15);
}

.preview-item img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    display: block;
}

.preview-name {
    font-size: 10px;
    padding: 7px;
    color: #dce8e3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.remove-image {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 25px;
    height: 25px;
    margin: 0;
    padding: 0;
    border-radius: 50%;
    background: #b00020;
    color: white;
    font-size: 14px;
    line-height: 25px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.generate {
    background: white;
    color: #0b3d2e;
}

.portals {
    background: #174f3d;
    color: white;
}

.logout {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    color: #ddd;
}

button:active {
    transform: scale(0.98);
}

.status {
    text-align: center;
    font-size: 13px;
    margin-top: 15px;
    color: #bdebd7;
}

.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 11px;
    color: #91a49d;
}

@media (max-width: 480px) {

    body {
        padding: 12px;
    }

    .card {
        padding: 18px;
    }

    .preview-container {
        grid-template-columns: 1fr 1fr;
    }

    .preview-item img {
        height: 120px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>MUSLIM YOUTH ADRA</h1>
        <p>Evidence Report Generator</p>
    </div>

    <div class="card">

        <label>Platform</label>

        <select id="platform">
            <option value="">Select Platform</option>
            <option>Facebook</option>
            <option>Instagram</option>
            <option>YouTube</option>
            <option>X / Twitter</option>
            <option>TikTok</option>
            <option>WhatsApp</option>
            <option>Telegram</option>
            <option>Other</option>
        </select>


        <label>Content Type</label>

        <select id="contentType">
            <option value="">Select Content Type</option>
            <option>Post</option>
            <option>Comment</option>
            <option>Video</option>
            <option>Image</option>
            <option>Message</option>
            <option>Profile</option>
            <option>Other</option>
        </select>


        <label>Date / Time of Observation</label>

        <input
            type="datetime-local"
            id="dateTime"
        >


        <label>Content URL</label>

        <input
            type="url"
            id="url"
            placeholder="https://..."
        >


        <label>Username / Page Name</label>

        <input
            type="text"
            id="username"
            placeholder="Username or page name"
        >


        <label>Screenshot Evidence</label>

        <div class="screenshot-box">

            <input
                type="file"
                id="screenshots"
                accept="image/jpeg,image/png,image/webp"
                multiple
            >

            <div
                class="preview-container"
                id="previewContainer">
            </div>

        </div>


        <label>Reported Content / Statement</label>

        <textarea
            id="content"
            placeholder="Enter the exact statement or describe the content..."
        ></textarea>


        <label>Additional Notes</label>

        <textarea
            id="notes"
            placeholder="Add any additional factual information..."
        ></textarea>


        <button
            class="generate"
            onclick="generatePDF()">
            GENERATE EVIDENCE PDF
        </button>


        <button
            class="portals"
            onclick="openPortals()">
            GOVERNMENT PORTALS
        </button>


        <button
            class="logout"
            onclick="logout()">
            LOGOUT
        </button>


        <div
            class="status"
            id="status">
        </div>

    </div>


    <div class="footer">
        Created by MUSLIM YOUTH ADRA
    </div>

</div>


<script>

/* LOGIN PROTECTION */

if (sessionStorage.getItem("mya_logged_in") !== "true") {

    window.location.replace("./index.html");

}


/* SCREENSHOT STORAGE */

let screenshotFiles = [];


/* SCREENSHOT SELECTION */

document
    .getElementById("screenshots")
    .addEventListener("change", function(event) {

        const files = Array.from(event.target.files);

        files.forEach(function(file) {

            if (!file.type.startsWith("image/")) {
                return;
            }

            screenshotFiles.push(file);

        });

        updatePreview();

        /*
         * Reset input so the same image can be selected again
         * if required.
         */

        event.target.value = "";

    });


/* UPDATE SCREENSHOT PREVIEW */

function updatePreview() {

    const container =
        document.getElementById("previewContainer");

    container.innerHTML = "";


    screenshotFiles.forEach(function(file, index) {

        const item =
            document.createElement("div");

        item.className = "preview-item";


        const img =
            document.createElement("img");


        const reader =
            new FileReader();


        reader.onload = function(e) {

            img.src = e.target.result;

        };


        reader.readAsDataURL(file);


        const name =
            document.createElement("div");

        name.className = "preview-name";

        name.textContent =
            file.name;


        const remove =
            document.createElement("button");

        remove.className =
            "remove-image";

        remove.type =
            "button";

        remove.textContent =
            "×";


        remove.onclick = function() {

            screenshotFiles.splice(index, 1);

            updatePreview();

        };


        item.appendChild(img);

        item.appendChild(name);

        item.appendChild(remove);

        container.appendChild(item);

    });

}


/* OPEN GOVERNMENT PORTALS */

function openPortals() {

    window.location.href =
        "./portals.html";

}


/* LOGOUT */

function logout() {

    sessionStorage.removeItem(
        "mya_logged_in"
    );

    window.location.replace(
        "./index.html"
    );

}


/* CONVERT IMAGE TO DATA */

function fileToDataURL(file) {

    return new Promise(function(resolve, reject) {

        const reader =
            new FileReader();

        reader.onload =
            function() {
                resolve(reader.result);
            };

        reader.onerror =
            function() {
                reject(
                    new Error(
                        "Image could not be read."
                    )
                );
            };

        reader.readAsDataURL(file);

    });

}


/* GET IMAGE DIMENSIONS */

function getImageDimensions(dataURL) {

    return new Promise(function(resolve, reject) {

        const img =
            new Image();

        img.onload =
            function() {

                resolve({
                    width: img.width,
                    height: img.height
                });

            };

        img.onerror =
            function() {

                reject(
                    new Error(
                        "Invalid image."
                    )
                );

            };

        img.src = dataURL;

    });

}


/* PDF GENERATOR */

async function generatePDF() {

    const status =
        document.getElementById("status");


    if (!window.jspdf ||
        !window.jspdf.jsPDF) {

        status.textContent =
            "PDF library load nahi hui. Internet connection check karein.";

        return;

    }


    const platform =
        document.getElementById("platform").value;


    const contentType =
        document.getElementById("contentType").value;


    const dateTime =
        document.getElementById("dateTime").value;


    const url =
        document
            .getElementById("url")
            .value
            .trim();


    const username =
        document
            .getElementById("username")
            .value
            .trim();


    const content =
        document
            .getElementById("content")
            .value
            .trim();


    const notes =
        document
            .getElementById("notes")
            .value
            .trim();


    if (!platform ||
        !contentType ||
        !dateTime ||
        !content) {

        status.textContent =
            "Please fill Platform, Content Type, Date/Time and Content.";

        return;

    }


    try {

        const { jsPDF } =
            window.jspdf;


        const pdf =
            new jsPDF();


        let y = 20;


        /* HEADER */

        pdf.setFontSize(18);

        pdf.setFont(
            "helvetica",
            "bold"
        );


        pdf.text(
            "MUSLIM YOUTH ADRA",
            105,
            y,
            {
                align: "center"
            }
        );


        y += 9;


        pdf.setFontSize(14);


        pdf.text(
            "SOCIAL MEDIA EVIDENCE REPORT",
            105,
            y,
            {
                align: "center"
            }
        );


        y += 15;


        pdf.setLineWidth(0.5);


        pdf.line(
            15,
            y,
            195,
            y
        );


        y += 12;


        /* REPORT INFORMATION */

        pdf.setFontSize(11);

        pdf.setFont(
            "helvetica",
            "bold"
        );


        pdf.text(
            "REPORT INFORMATION",
            15,
            y
        );


        y += 8;


        pdf.setFont(
            "helvetica",
            "normal"
        );


        pdf.text(
            "Platform: " + platform,
            15,
            y
        );


        y += 7;


        pdf.text(
            "Content Type: " + contentType,
            15,
            y
        );


        y += 7;


        pdf.text(
            "Date / Time: " + dateTime,
            15,
            y
        );


        y += 7;


        pdf.text(
            "Username / Page: " +
            (username || "Not provided"),
            15,
            y
        );


        y += 7;


        /* URL */

        pdf.text(
            "Content URL:",
            15,
            y
        );


        y += 6;


        const urlLines =
            pdf.splitTextToSize(
                url || "Not provided",
                175
            );


        pdf.text(
            urlLines,
            15,
            y
        );


        y +=
            urlLines.length * 6 +
            7;


        /* CONTENT */

        pdf.setFont(
            "helvetica",
            "bold"
        );


        pdf.text(
            "REPORTED CONTENT / STATEMENT",
            15,
            y
        );


        y += 7;


        pdf.setFont(
            "helvetica",
            "normal"
        );


        const contentLines =
            pdf.splitTextToSize(
                content,
                175
            );


        /*
         * Add page if content is too long.
         */

        if (
            y +
            contentLines.length * 6 >
            245
        ) {

            pdf.addPage();

            y = 20;

        }


        pdf.text(
            contentLines,
            15,
            y
        );


        y +=
            contentLines.length * 6 +
            10;


        /* NOTES */

        if (notes) {

            pdf.setFont(
                "helvetica",
                "bold"
            );


            if (y > 245) {

                pdf.addPage();

                y = 20;

            }


            pdf.text(
                "ADDITIONAL NOTES",
                15,
                y
            );


            y += 7;


            pdf.setFont(
                "helvetica",
                "normal"
            );


            const noteLines =
                pdf.splitTextToSize(
                    notes,
                    175
                );


            if (
                y +
                noteLines.length * 6 >
                250
            ) {

                pdf.addPage();

                y = 20;

            }


            pdf.text(
                noteLines,
                15,
                y
            );


            y +=
                noteLines.length * 6 +
                10;

        }


        /* SCREENSHOTS */

        if (screenshotFiles.length > 0) {

            pdf.addPage();

            y = 20;


            pdf.setFontSize(14);

            pdf.setFont(
                "helvetica",
                "bold"
            );


            pdf.text(
                "SCREENSHOT EVIDENCE",
                105,
                y,
                {
                    align: "center"
                }
            );


            y += 12;


            for (
                let i = 0;
                i < screenshotFiles.length;
                i++
            ) {

                const file =
                    screenshotFiles[i];


                const dataURL =
                    await fileToDataURL(file);


                const dimensions =
                    await getImageDimensions(
                        dataURL
                    );


                /*
                 * New page for every screenshot.
                 * This keeps screenshots clear and readable.
                 */

                if (i > 0) {

                    pdf.addPage();

                    y = 20;

                }


                pdf.setFontSize(10);

                pdf.setFont(
                    "helvetica",
                    "bold"
                );


                pdf.text(
                    "Screenshot " +
                    (i + 1) +
                    " of " +
                    screenshotFiles.length,
                    15,
                    y
                );


                y += 7;


                pdf.setFont(
                    "helvetica",
                    "normal"
                );


                /*
                 * Available PDF area
                 */

                const maxWidth = 180;

                const maxHeight = 245;


                let imgWidth =
                    dimensions.width;

                let imgHeight =
                    dimensions.height;


                /*
                 * Scale image to fit page.
                 */

                const widthRatio =
                    maxWidth /
                    imgWidth;


                const heightRatio =
                    maxHeight /
                    imgHeight;


                const ratio =
                    Math.min(
                        widthRatio,
                        heightRatio,
                        1
                    );


                imgWidth *= ratio;

                imgHeight *= ratio;


                /*
                 * Center image horizontally.
                 */

                const x =
                    (210 - imgWidth) / 2;


                pdf.addImage(
                    dataURL,
                    getImageFormat(file),
                    x,
                    y,
                    imgWidth,
                    imgHeight
                );


                /*
                 * Screenshot filename.
                 */

                const captionY =
                    Math.min(
                        y +
                        imgHeight +
                        7,
                        285
                    );


                pdf.setFontSize(8);


                pdf.text(
                    "File: " +
                    file.name,
                    15,
                    captionY
                );

            }

        }


        /* DISCLAIMER */

        pdf.addPage();

        y = 20;


        pdf.setFontSize(11);

        pdf.setFont(
            "helvetica",
            "bold"
        );


        pdf.text(
            "DOCUMENTATION NOTE",
            15,
            y
        );


        y += 8;


        pdf.setFontSize(9);

        pdf.setFont(
            "helvetica",
            "italic"
        );


        const disclaimer =
            "This report is a factual record prepared for documentation " +
            "and reporting purposes. Verify the original content and URL " +
            "before submitting a report to any authority.";


        const disclaimerLines =
            pdf.splitTextToSize(
                disclaimer,
                175
            );


        pdf.text(
            disclaimerLines,
            15,
            y
        );


        /* SAVE */

        const filename =
            "MUSLIM_YOUTH_ADRA_Evidence_Report.pdf";


        pdf.save(filename);


        status.textContent =
            "PDF successfully generated.";

    }

    catch (error) {

        console.error(error);


        status.textContent =
            "PDF generate nahi hua. Please try again.";

    }

}


/* DETECT IMAGE FORMAT */

function getImageFormat(file) {

    if (
        file.type ===
        "image/png"
    ) {

        return "PNG";

    }


    if (
        file.type ===
        "image/webp"
    ) {

        /*
         * jsPDF support can vary for WebP,
         * so convert it through canvas.
         */

        return "JPEG";

    }


    return "JPEG";

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MUSLIM YOUTH ADRA - PDF Generator</title>

    <!-- jsPDF library - PDF browser mein generate hoga -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f3faf6;
            color: #222;
        }

        /* HEADER */

        header {
            background: #087a3d;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
        }

        .brand {
            font-size: 17px;
            font-weight: bold;
            letter-spacing: .4px;
        }

        .logout-btn {
            border: 1px solid rgba(255,255,255,.5);
            background: transparent;
            color: white;
            padding: 7px 13px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 11px;
        }

        .logout-btn:hover {
            background: white;
            color: #087a3d;
        }

        /* MAIN */

        .container {
            width: 100%;
            max-width: 900px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .page-title {
            text-align: center;
            color: #075d30;
            font-size: 23px;
            margin-bottom: 5px;
        }

        .page-subtitle {
            text-align: center;
            color: #777;
            font-size: 12px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 6px 25px rgba(0,70,35,.08);
            border: 1px solid #e2eee6;
        }

        /* FORM */

        .section-title {
            color: #087a3d;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 18px;
            padding-bottom: 9px;
            border-bottom: 1px solid #e5eee8;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid #d6e5dc;
            border-radius: 8px;
            padding: 11px;
            outline: none;
            background: #fcfefd;
            font-size: 13px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #087a3d;
            box-shadow: 0 0 0 3px rgba(8,122,61,.07);
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 23px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 12px;
            font-weight: bold;
        }

        .generate-btn {
            background: #087a3d;
            color: white;
        }

        .generate-btn:hover {
            background: #056630;
        }

        .clear-btn {
            background: #edf4ef;
            color: #075d30;
        }

        .clear-btn:hover {
            background: #e0ece3;
        }

        /* RESULT */

        #result {
            display: none;
            margin-top: 20px;
            padding: 13px;
            background: #eef9f2;
            border: 1px solid #cde7d5;
            border-radius: 8px;
            color: #176534;
            font-size: 12px;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 10px;
        }

        footer a {
            color: #087a3d;
            text-decoration: none;
            font-weight: bold;
        }

        /* MOBILE */

        @media(max-width: 650px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .card {
                padding: 20px 16px;
            }

            .page-title {
                font-size: 20px;
            }

            header {
                padding: 13px 15px;
            }

            .brand {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="brand">
            MUSLIM YOUTH ADRA
        </div>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </header>


    <!-- MAIN -->

    <main class="container">

        <h1 class="page-title">
            PDF Generator
        </h1>

        <p class="page-subtitle">
            Fill the details below and generate your PDF
        </p>


        <div class="card">

            <div class="section-title">
                Document Information
            </div>


            <div class="form-grid">

                <!-- NAME -->

                <div class="field">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter full name"
                    >

                </div>


                <!-- FATHER NAME -->

                <div class="field">

                    <label for="father">
                        Father's / Guardian's Name
                    </label>

                    <input
                        type="text"
                        id="father"
                        placeholder="Enter name"
                    >

                </div>


                <!-- DATE OF BIRTH -->

                <div class="field">

                    <label for="dob">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="dob"
                    >

                </div>


                <!-- GENDER -->

                <div class="field">

                    <label for="gender">
                        Gender
                    </label>

                    <select id="gender">

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- PHONE -->

                <div class="field">

                    <label for="phone">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter mobile number"
                    >

                </div>


                <!-- EMAIL -->

                <div class="field">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                    >

                </div>


                <!-- ADDRESS -->

                <div class="field full">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter complete address"
                    ></textarea>

                </div>


                <!-- PURPOSE -->

                <div class="field full">

                    <label for="purpose">
                        Purpose / Description
                    </label>

                    <textarea
                        id="purpose"
                        placeholder="Enter purpose or description"
                    ></textarea>

                </div>


                <!-- DATE -->

                <div class="field">

                    <label for="documentDate">
                        Document Date
                    </label>

                    <input
                        type="date"
                        id="documentDate"
                    >

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    class="generate-btn"
                    onclick="generatePDF()"
                >
                    Generate & Download PDF
                </button>

                <button
                    class="clear-btn"
                    onclick="clearForm()"
                >
                    Clear Form
                </button>

            </div>


            <div id="result">
                PDF generated successfully.
            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        Created by

        <a
            href="https://www.instagram.com/be.like_sahil?stkn=MTF3eWhrZ3o1NWdzeQ=="
            target="_blank"
            rel="noopener noreferrer"
        >
            @be.like_sahil
        </a>

    </footer>


    <script>

        // ==========================================
        // LOGIN PROTECTION
        // ==========================================

        if (sessionStorage.getItem("mya_logged_in") !== "true") {

            window.location.href = "index.html";

        }


        // ==========================================
        // SET TODAY'S DATE
        // ==========================================

        const today = new Date().toISOString().split("T")[0];

        document.getElementById("documentDate").value = today;


        // ==========================================
        // LOGOUT
        // ==========================================

        function logout() {

            sessionStorage.removeItem("mya_logged_in");

            window.location.href = "index.html";

        }


        // ==========================================
        // GET FIELD VALUE
        // ==========================================

        function value(id) {

            const element = document.getElementById(id);

            return element.value.trim();

        }


        // ==========================================
        // GENERATE PDF
        // ==========================================

        function generatePDF() {

            const name = value("name");
            const father = value("father");
            const dob = value("dob");
            const gender = value("gender");
            const phone = value("phone");
            const email = value("email");
            const address = value("address");
            const purpose = value("purpose");
            const documentDate = value("documentDate");


            // Basic validation

            if (!name) {

                alert("Please enter Full Name.");

                document.getElementById("name").focus();

                return;

            }


            // jsPDF

            const { jsPDF } = window.jspdf;

            const doc = new jsPDF();


            // Page dimensions

            const pageWidth = doc.internal.pageSize.getWidth();


            // HEADER

            doc.setFillColor(8, 122, 61);

            doc.rect(
                0,
                0,
                pageWidth,
                30,
                "F"
            );


            // Title

            doc.setTextColor(255, 255, 255);

            doc.setFontSize(17);

            doc.setFont("helvetica", "bold");

            doc.text(
                "MUSLIM YOUTH ADRA",
                pageWidth / 2,
                13,
                {
                    align: "center"
                }
            );


            doc.setFontSize(10);

            doc.setFont("helvetica", "normal");

            doc.text(
                "Document Information",
                pageWidth / 2,
                22,
                {
                    align: "center"
                }
            );


            // Reset text color

            doc.setTextColor(30, 30, 30);


            // Starting position

            let y = 45;


            // Helper function

            function addField(label, text) {

                if (!text) {
                    text = "Not provided";
                }

                doc.setFont("helvetica", "bold");

                doc.setFontSize(10);

                doc.text(
                    label,
                    20,
                    y
                );

                y += 6;

                doc.setFont("helvetica", "normal");

                doc.setFontSize(10);


                const lines = doc.splitTextToSize(
                    text,
                    165
                );


                doc.text(
                    lines,
                    20,
                    y
                );


                y += (lines.length * 5) + 8;


                // New page if needed

                if (y > 270) {

                    doc.addPage();

                    y = 25;

                }

            }


            // DATA

            addField(
                "Full Name",
                name
            );

            addField(
                "Father's / Guardian's Name",
                father
            );

            addField(
                "Date of Birth",
                dob
            );

            addField(
                "Gender",
                gender
            );

            addField(
                "Mobile Number",
                phone
            );

            addField(
                "Email Address",
                email
            );

            addField(
                "Address",
                address
            );

            addField(
                "Purpose / Description",
                purpose
            );

            addField(
                "Document Date",
                documentDate
            );


            // FOOTER

            const pageCount =
                doc.internal.getNumberOfPages();


            for (
                let i = 1;
                i <= pageCount;
                i++
            ) {

                doc.setPage(i);

                const height =
                    doc.internal.pageSize.getHeight();


                doc.setFontSize(8);

                doc.setTextColor(
                    120,
                    120,
                    120
                );


                doc.text(
                    "Created by @be.like_sahil",
                    pageWidth / 2,
                    height - 12,
                    {
                        align: "center"
                    }
                );


                doc.text(
                    "Page " + i + " of " + pageCount,
                    pageWidth / 2,
                    height - 6,
                    {
                        align: "center"
                    }
                );

            }


            // FILE NAME

            let safeName =
                name
                    .replace(/[^a-z0-9]/gi, "_")
                    .substring(0, 40);


            if (!safeName) {
                safeName = "document";
            }


            // DOWNLOAD

            doc.save(
                "MUSLIM_YOUTH_ADRA_" +
                safeName +
                ".pdf"
            );


            // SUCCESS MESSAGE

            const result =
                document.getElementById("result");

            result.style.display = "block";

            result.textContent =
                "PDF generated and downloaded successfully.";


            setTimeout(function() {

                result.style.display = "none";

            }, 4000);

        }


        // ==========================================
        // CLEAR FORM
        // ==========================================

        function clearForm() {

            if (
                confirm(
                    "Are you sure you want to clear all fields?"
                )
            ) {

                document.getElementById(
                    "loginForm"
                )?.reset();

                document
                    .querySelectorAll(
                        "input, textarea, select"
                    )
                    .forEach(function(element) {

                        if (
                            element.id !==
                            "documentDate"
                        ) {

                            element.value = "";

                        }

                    });


                document.getElementById(
                    "documentDate"
                ).value = today;

            }

        }

    </script>

</body>
</html>

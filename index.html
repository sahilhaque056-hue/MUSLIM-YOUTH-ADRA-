<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Secure Login</title>

<style>

/* ==========================================
   RESET
========================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* ==========================================
   BODY
========================================== */

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #1e293b,
            #334155
        );

    color:#172033;

}


/* ==========================================
   LOGIN CONTAINER
========================================== */

.login-container{

    width:100%;

    max-width:420px;

}


/* ==========================================
   LOGIN CARD
========================================== */

.login-card{

    background:#ffffff;

    border-radius:18px;

    padding:30px 25px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.25);

}


/* ==========================================
   HEADER
========================================== */

.logo{

    width:65px;

    height:65px;

    margin:0 auto 15px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#2563eb;

    color:#ffffff;

    font-size:27px;

    font-weight:bold;

}


h1{

    text-align:center;

    font-size:24px;

    color:#111827;

    margin-bottom:7px;

}


.subtitle{

    text-align:center;

    color:#64748b;

    font-size:13px;

    margin-bottom:25px;

}


/* ==========================================
   FORM
========================================== */

.form-group{

    margin-bottom:17px;

}


label{

    display:block;

    margin-bottom:7px;

    font-size:14px;

    font-weight:bold;

    color:#334155;

}


input{

    width:100%;

    height:48px;

    padding:0 13px;

    border:1px solid #cbd5e1;

    border-radius:9px;

    outline:none;

    font-size:14px;

    background:#ffffff;

    color:#111827;

    transition:.2s;

}


input:focus{

    border-color:#2563eb;

    box-shadow:
        0 0 0 3px rgba(37,99,235,.10);

}


/* ==========================================
   PASSWORD WRAPPER
========================================== */

.password-wrapper{

    position:relative;

}


.password-wrapper input{

    padding-right:65px;

}


#showPassword{

    position:absolute;

    right:7px;

    top:7px;

    height:34px;

    padding:0 10px;

    border:0;

    border-radius:7px;

    background:#e2e8f0;

    color:#334155;

    font-size:12px;

    font-weight:bold;

    cursor:pointer;

}


#showPassword:hover{

    background:#cbd5e1;

}


/* ==========================================
   LOGIN BUTTON
========================================== */

.login-button{

    width:100%;

    height:48px;

    border:0;

    border-radius:9px;

    background:#2563eb;

    color:#ffffff;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.login-button:hover{

    background:#1d4ed8;

}


.login-button:active{

    transform:scale(.98);

}


/* ==========================================
   ERROR MESSAGE
========================================== */

#errorMessage{

    display:none;

    margin-bottom:15px;

    padding:11px;

    border-radius:8px;

    background:#fef2f2;

    border:1px solid #fecaca;

    color:#b91c1c;

    font-size:13px;

    text-align:center;

}


/* ==========================================
   FOOTER
========================================== */

.footer{

    text-align:center;

    margin-top:22px;

    color:#64748b;

    font-size:12px;

}


.footer a{

    color:#2563eb;

    text-decoration:none;

    font-weight:bold;

}


.footer a:hover{

    text-decoration:underline;

}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:480px){

    body{

        padding:15px;

    }

    .login-card{

        padding:25px 18px;

    }

    h1{

        font-size:21px;

    }

}

</style>

</head>


<body>


<div class="login-container">

    <div class="login-card">


        <!-- ==================================
             LOGO
        =================================== -->

        <div class="logo">
            M
        </div>


        <!-- ==================================
             TITLE
        =================================== -->

        <h1>
            Secure Login
        </h1>


        <div class="subtitle">
            Login to continue
        </div>


        <!-- ==================================
             ERROR
        =================================== -->

        <div id="errorMessage">
            Invalid username or password.
        </div>


        <!-- ==================================
             LOGIN FORM
        =================================== -->

        <form id="loginForm">


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        id="showPassword">

                        Show

                    </button>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-button">

                Login

            </button>


        </form>


        <!-- ==================================
             FOOTER
        =================================== -->

        <div class="footer">

            Created by

            <a
                href="https://www.instagram.com/be.like_sahil?stkn=MTF3eWhrZ3o1NWdzeQ=="
                target="_blank"
                rel="noopener noreferrer">

                @be.like_sahil

            </a>

        </div>


    </div>

</div>



<script>

/* ==========================================
   LOGIN DETAILS
========================================== */

const CORRECT_USERNAME = "admin";

const CORRECT_PASSWORD = "12345";


/* ==========================================
   GET ELEMENTS
========================================== */

const loginForm =
    document.getElementById("loginForm");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const errorMessage =
    document.getElementById("errorMessage");

const showPasswordButton =
    document.getElementById("showPassword");


/* ==========================================
   LOGIN
========================================== */

loginForm.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const username =
            usernameInput.value.trim();

        const password =
            passwordInput.value;


        /* CHECK LOGIN */

        if(
            username === CORRECT_USERNAME &&
            password === CORRECT_PASSWORD
        ){

            /*
             * Save login state.
             */

            sessionStorage.setItem(
                "mya_logged_in",
                "true"
            );


            /*
             * IMPORTANT:
             *
             * pdf.html MUST be in the
             * SAME folder as index.html.
             */

            window.location.assign(
                "./pdf.html"
            );


        }else{

            errorMessage.style.display =
                "block";


            passwordInput.value = "";


            passwordInput.focus();


            setTimeout(
                function(){

                    errorMessage.style.display =
                        "none";

                },
                3000
            );

        }

    }
);


/* ==========================================
   SHOW / HIDE PASSWORD
========================================== */

showPasswordButton.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type === "password"
        ){

            passwordInput.type = "text";

            showPasswordButton.textContent =
                "Hide";

        }else{

            passwordInput.type = "password";

            showPasswordButton.textContent =
                "Show";

        }

    }
);

</script>


</body>

</html>

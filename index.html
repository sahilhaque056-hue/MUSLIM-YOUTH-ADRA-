<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MUSLIM YOUTH ADRA - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f4fff8, #e5f7ec);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 390px;
            background: #ffffff;
            border-radius: 18px;
            padding: 35px 28px 25px;
            box-shadow: 0 12px 40px rgba(0, 80, 40, 0.12);
            border: 1px solid #e1f0e6;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #087a3d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #075d30;
            font-size: 23px;
            letter-spacing: 0.5px;
            margin-bottom: 7px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 12px;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            color: #333;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            height: 46px;
            border: 1px solid #d7e5dc;
            border-radius: 9px;
            padding: 0 13px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            background: #fbfdfc;
        }

        input:focus {
            border-color: #087a3d;
            box-shadow: 0 0 0 3px rgba(8, 122, 61, 0.08);
            background: #fff;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 55px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #087a3d;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .login-btn {
            width: 100%;
            height: 47px;
            margin-top: 7px;
            border: none;
            border-radius: 9px;
            background: #087a3d;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #056630;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .error {
            display: none;
            margin-top: 14px;
            padding: 10px;
            border-radius: 7px;
            background: #fff0f0;
            color: #c62828;
            text-align: center;
            font-size: 12px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 17px;
            border-top: 1px solid #edf2ee;
            color: #999;
            font-size: 10px;
        }

        .footer a {
            color: #087a3d;
            text-decoration: none;
            font-weight: bold;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 400px) {
            .login-container {
                padding: 30px 22px 23px;
            }

            h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            MYA
        </div>

        <h1>MUSLIM YOUTH ADRA</h1>

        <p class="subtitle">
            Welcome · Please login to continue
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        Show
                    </button>

                </div>
            </div>

            <button type="submit" class="login-btn">
                LOGIN
            </button>

            <div class="error" id="errorMessage">
                Invalid username or password.
            </div>

        </form>

        <div class="footer">
            Created by
            <a
                href="https://www.instagram.com/be.like_sahil?stkn=MTF3eWhrZ3o1NWdzeQ=="
                target="_blank"
                rel="noopener noreferrer"
            >
                @be.like_sahil
            </a>
        </div>

    </div>


    <script>

        // ==========================================
        // CHANGE YOUR LOGIN DETAILS HERE
        // ==========================================

        const CORRECT_USERNAME = "admin";
        const CORRECT_PASSWORD = "12345";


        // ==========================================
        // LOGIN SYSTEM
        // ==========================================

        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const errorMessage = document.getElementById("errorMessage");

        loginForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (
                username === CORRECT_USERNAME &&
                password === CORRECT_PASSWORD
            ) {

                // Save login state
                sessionStorage.setItem("mya_logged_in", "true");

                // Next page
                window.location.href = "pdf.html";

            } else {

                errorMessage.style.display = "block";

                passwordInput.value = "";

                setTimeout(function() {
                    errorMessage.style.display = "none";
                }, 3000);
            }

        });


        // ==========================================
        // SHOW / HIDE PASSWORD
        // ==========================================

        const showPasswordButton =
            document.getElementById("showPassword");

        showPasswordButton.addEventListener("click", function() {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";
                showPasswordButton.textContent = "Hide";

            } else {

                passwordInput.type = "password";
                showPasswordButton.textContent = "Show";

            }

        });

    </script>

</body>
</html>
